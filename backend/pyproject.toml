[project]
name = "ai-video-integration-backend"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "pywin32==312; sys_platform == 'win32'",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
  "pyinstaller==6.22.3", "httpx==0.28.1", "pytest==9.1.1",
  "ruff==0.16.7", "mypy==2.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32event", "win32job", "win32pipe", "win32process", "pywintypes"]
follow_untyped_imports = true
